<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B0316" />

  <!-- ─────────────────────────────────────────────────────────────────
         STATIC FALLBACK. Deliberately generic, describing the whole site
         rather than the homepage.

         React sets per-route <title>, description and canonical on mount
         (src/utils/meta.js), and Google runs JavaScript so it sees those.
         Most social preview crawlers - WhatsApp, Slack, LinkedIn, Twitter -
         do NOT: they read this raw HTML and never execute anything. So
         every link anyone shares, of any page, previews with what is below.

         Genuine per-page previews need server-rendered tags. Until then,
         these must read sensibly for any page on the site.
         ───────────────────────────────────────────────────────────────── -->
  <meta name="description"
    content="Free security tools and an outside-in scan of your company from Duncanloop. Check email spoofing, SSL certificates, security headers, lookalike domains and password exposure. No sign-up, no card." />

  <meta property="og:title" content="dShield - Free Security Scan by Duncanloop" />
  <meta property="og:description"
    content="See what an attacker sees of your company. Free security tools and an outside-in scan - email spoofing, certificates, exposed files and lookalike domains. No sign-up." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://duncanloop.in/" />
  <meta property="og:site_name" content="dShield" />
  <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="dShield - See what an attacker sees" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="dShield - Free Security Scan by Duncanloop" />
  <meta name="twitter:description"
    content="See what an attacker sees of your company. Free security tools and an outside-in scan. No sign-up." />
  <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
  <!-- The Duncanloop tiles, from src/assets/img/duncanloop_mini_logo_trimmed.png.

         favicon.ico (16-256px) and favicon-32.png are transparent, with no
         plate behind them: the tiles are bright mid tones that hold up on a
         light, dark or grey tab strip alike. apple-touch-icon, logo192 and
         logo512 sit on solid #0B0316: iOS composites a transparent touch
         icon onto black whatever we do, and an installed-app icon should
         not depend on the launcher's background either. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <title>dShield - Free Security Scan by Duncanloop</title>
</head>

<body>
  <noscript>dShield needs JavaScript to run a scan.</noscript>
  <div id="root"></div>
</body>

</html>
